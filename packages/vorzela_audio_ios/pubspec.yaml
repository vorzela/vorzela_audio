name: vorzela_audio_ios
description: iOS AVPlayer implementation for vorzela_audio.
version: 0.2.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  vorzela_audio_platform_interface:
    path: ../vorzela_audio_platform_interface

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    implements: vorzela_audio
    platforms:
      ios:
        pluginClass: VorzelaAudioPlugin
        dartPluginClass: VorzelaAudioIOS
